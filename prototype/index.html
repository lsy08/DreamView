<title>DreamView</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&family=Ma+Shan+Zheng&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@500;700&display=swap">
<style>
/* Layout: app shell — top bar, sidebar library tree, content pane where each view scrolls on its own; photos stay the brightest thing on screen.
   Dark first: a darkroom graphite with a muted safelight-amber accent. */
:root {
  --bg: #111214;
  --surface: #17181b;
  --raise: #1f2024;
  --line: #2a2b30;
  --fg: #ecebe7;
  --muted: #9b9994;
  --faint: #6c6b67;
  --accent: #e2a35a;
  --accent-ink: #1b1207;
  --accent-soft: rgba(226,163,90,.14);
  --shadow: 0 10px 30px rgba(0,0,0,.45);
  --font-display: "Instrument Serif", "Noto Serif SC", "Songti SC", Georgia, serif;
  --font-cjk-display: "Noto Serif SC", "Songti SC", "SimSun", serif;
  --font-body: "Noto Sans SC", "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", "Cascadia Mono", Consolas, monospace;
  --font-hand: "Ma Shan Zheng", "KaiTi", "STKaiti", cursive;
  --r: 10px;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #f3f3f1; --surface: #ffffff; --raise: #eaeae7; --line: #dcdcd8;
    --fg: #1b1c1e; --muted: #5f5e5a; --faint: #8e8d89;
    --accent: #a9621b; --accent-ink: #ffffff; --accent-soft: rgba(169,98,27,.12);
    --shadow: 0 10px 30px rgba(30,25,15,.14);
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #f3f3f1; --surface: #ffffff; --raise: #eaeae7; --line: #dcdcd8;
  --fg: #1b1c1e; --muted: #5f5e5a; --faint: #8e8d89;
  --accent: #a9621b; --accent-ink: #ffffff; --accent-soft: rgba(169,98,27,.12);
  --shadow: 0 10px 30px rgba(30,25,15,.14);
  color-scheme: light;
}

html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 14px; line-height: 1.5; overflow: hidden; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
svg.i { width: 18px; height: 18px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }

.app { height: 100%; display: grid; grid-template-rows: auto 1fr auto; }

/* ---------- top bar ---------- */
.topbar {
  display: flex; align-items: center; gap: 20px; height: 58px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  border-bottom: 1px solid var(--line); background: var(--bg);
}
.brand { display: flex; align-items: center; gap: 10px; font-family: var(--font-display); font-size: 25px; letter-spacing: .01em; white-space: nowrap; }
.brand svg { width: 26px; height: 26px; color: var(--accent); }
.menu-btn { display: none; }
.tabs { display: flex; gap: 4px; }
.tab { display: flex; align-items: center; gap: 7px; padding: 7px 12px; border-radius: 8px; color: var(--muted); white-space: nowrap; }
.tab:hover { color: var(--fg); background: var(--raise); }
.tab[aria-current="true"] { color: var(--fg); background: var(--raise); box-shadow: inset 0 -2px 0 var(--accent); }
.search { flex: 1; max-width: 420px; margin-left: auto; position: relative; }
.search input { width: 100%; height: 36px; border-radius: 18px; border: 1px solid var(--line); background: var(--surface); padding: 0 14px 0 36px; outline: none; }
.search input:focus { border-color: var(--accent); }
.search svg { position: absolute; left: 12px; top: 9px; color: var(--faint); }
.top-actions { display: flex; gap: 6px; }
.icon-btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 36px; min-width: 36px; padding: 0 10px; border-radius: 18px; color: var(--muted); border: 1px solid transparent; white-space: nowrap; }
.icon-btn:hover { color: var(--fg); background: var(--raise); }
.icon-btn.outline { border-color: var(--line); }

/* ---------- shell ---------- */
.shell { display: grid; grid-template-columns: 236px 1fr; min-height: 0; }
.sidebar { border-right: 1px solid var(--line); overflow-y: auto; padding-block: 18px 24px; padding-left: max(14px, env(safe-area-inset-left, 0px)); padding-right: 14px; display: flex; flex-direction: column; gap: 22px; background: var(--bg); }
.side-group h4 { margin: 0 0 6px 10px; font-size: 11px; font-weight: 500; letter-spacing: .12em; color: var(--faint); text-transform: uppercase; }
.side-item { width: 100%; display: flex; align-items: center; gap: 10px; padding: 6px 10px; border-radius: 8px; color: var(--muted); text-align: left; }
.side-item:hover { background: var(--raise); color: var(--fg); }
.side-item[aria-current="true"] { background: var(--accent-soft); color: var(--fg); }
.side-item[aria-current="true"] svg { color: var(--accent); }
.side-item .n { margin-left: auto; font-family: var(--font-mono); font-size: 12px; color: var(--faint); }
.side-item .dot { width: 8px; height: 8px; border-radius: 2px; flex: none; }
.folder { display: flex; flex-direction: column; gap: 2px; padding: 6px 10px; font-size: 12.5px; color: var(--muted); }
.folder .p { font-family: var(--font-mono); font-size: 12px; color: var(--fg); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.folder .s { display: flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--faint); }
.pulse { width: 6px; height: 6px; border-radius: 50%; background: #5bbf7a; box-shadow: 0 0 0 3px rgba(91,191,122,.18); }
.side-stats { margin-top: auto; padding: 12px 10px 0; border-top: 1px solid var(--line); font-size: 12px; color: var(--faint); display: grid; gap: 4px; }
.side-stats b { color: var(--fg); font-weight: 500; }

.content { position: relative; min-height: 0; min-width: 0; overflow: hidden; }
.view { height: 100%; overflow-y: auto; overflow-x: hidden; }

/* ---------- library ---------- */
#view-library { padding-block: 0 120px; padding-left: 24px; padding-right: max(48px, env(safe-area-inset-right, 0px)); }
.lib-head { position: sticky; top: 0; z-index: 5; background: var(--bg); padding-block: 18px 12px; display: flex; flex-wrap: wrap; align-items: flex-end; gap: 12px 20px; }
.lib-title { min-width: 0; }
.lib-title h1 { margin: 0; font-family: var(--font-cjk-display); font-weight: 700; font-size: 26px; line-height: 1.2; text-wrap: balance; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.lib-title p { margin: 4px 0 0; color: var(--muted); font-size: 12.5px; }
.chip-x { display: inline-flex; align-items: center; gap: 4px; font-family: var(--font-body); font-size: 12px; font-weight: 400; padding: 3px 6px 3px 10px; border-radius: 12px; background: var(--accent-soft); color: var(--accent); }
.controls { margin-left: auto; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.ctl { display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--muted); font-size: 13px; white-space: nowrap; }
.ctl:hover { color: var(--fg); }
.ctl select { appearance: none; border: 0; background: transparent; color: var(--fg); padding-right: 14px; cursor: pointer; outline: none;
  background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%);
  background-position: right 4px top 55%, right 0 top 55%; background-size: 4px 4px; background-repeat: no-repeat; }
.ctl select option { background: var(--surface); color: var(--fg); }
.ctl input[type=range] { width: 84px; accent-color: var(--accent); }
.ctl.on { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
.badge { min-width: 18px; height: 18px; border-radius: 9px; background: var(--accent); color: var(--accent-ink); font-size: 11px; display: inline-flex; align-items: center; justify-content: center; padding: 0 5px; }

.filters { display: flex; flex-wrap: wrap; gap: 14px 26px; padding: 14px 16px; margin-bottom: 8px; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
.f-row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.f-row > span { font-size: 12px; color: var(--faint); margin-right: 4px; }
.pill { height: 28px; padding: 0 11px; border-radius: 14px; border: 1px solid var(--line); font-size: 12.5px; color: var(--muted); white-space: nowrap; }
.pill:hover { color: var(--fg); }
.pill[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }

.group { padding-top: 22px; }
.g-head { display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 12px; margin-bottom: 10px; }
.g-head h3 { margin: 0; font-family: var(--font-cjk-display); font-size: 18px; font-weight: 500; }
.g-head .sub { color: var(--muted); font-size: 12.5px; }
.g-head .cnt { color: var(--faint); font-size: 12px; }
.g-sel { margin-left: auto; font-size: 12px; color: var(--faint); opacity: 0; transition: opacity .15s; }
.group:hover .g-sel, body.selecting .g-sel { opacity: 1; }
.g-sel:hover { color: var(--accent); }

.grid { display: flex; flex-wrap: wrap; gap: 6px; }
.tile { position: relative; overflow: hidden; border-radius: 4px; background: var(--raise); cursor: zoom-in; flex: none; }
.tile img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .25s ease, opacity .3s; }
.tile:hover img { transform: scale(1.025); }
.tile-ov { position: absolute; inset: auto 0 0 0; padding: 22px 10px 8px; display: flex; justify-content: space-between; align-items: flex-end; gap: 8px; color: #fff; font-size: 11.5px;
  background: linear-gradient(transparent, rgba(0,0,0,.62)); opacity: 0; transition: opacity .2s; pointer-events: none; }
.tile:hover .tile-ov { opacity: 1; }
.tile-ov .t-exif { font-family: var(--font-mono); font-size: 10.5px; opacity: .85; white-space: nowrap; }
.tile-ov .t-loc { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.t-fav { position: absolute; top: 7px; right: 8px; color: #fff; filter: drop-shadow(0 1px 2px rgba(0,0,0,.6)); }
.t-fav svg { width: 15px; height: 15px; fill: currentColor; }
.t-check { position: absolute; top: 8px; left: 8px; width: 22px; height: 22px; border-radius: 50%; border: 2px solid rgba(255,255,255,.9); background: rgba(0,0,0,.25); display: none; align-items: center; justify-content: center; }
.t-check svg { width: 14px; height: 14px; stroke: var(--accent-ink); stroke-width: 3; opacity: 0; }
body.selecting .tile { cursor: pointer; }
body.selecting .t-check { display: flex; }
.tile.sel { background: var(--accent-soft); }
.tile.sel img { transform: scale(.88); border-radius: 3px; }
.tile.sel .t-check { background: var(--accent); border-color: var(--accent); }
.tile.sel .t-check svg { opacity: 1; }
.empty { padding: 80px 0; text-align: center; color: var(--muted); }

.scrubber { position: absolute; top: 90px; bottom: 30px; right: max(6px, env(safe-area-inset-right, 0px)); width: 36px; display: flex; flex-direction: column; align-items: center; gap: 2px; z-index: 6; overflow: hidden; }
.scrubber .yr { font-family: var(--font-mono); font-size: 10.5px; color: var(--muted); padding: 6px 0 2px; cursor: pointer; }
.scrubber .mo { width: 100%; height: 14px; display: flex; align-items: center; justify-content: center; cursor: pointer; position: relative; }
.scrubber .mo::before { content: ""; width: 8px; height: 2px; border-radius: 1px; background: var(--line); transition: all .15s; }
.scrubber .mo:hover::before { width: 16px; background: var(--muted); }
.scrubber .mo.on::before { width: 18px; background: var(--accent); }
.scrubber .mo:hover::after { content: attr(data-l); position: absolute; right: 34px; top: -4px; background: var(--fg); color: var(--bg); font-size: 11px; padding: 1px 8px; border-radius: 4px; white-space: nowrap; }

/* ---------- selection bar ---------- */
.selbar { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(22px + env(safe-area-inset-bottom, 0px)); z-index: 30; display: flex; align-items: center; gap: 6px; padding: 8px 8px 8px 18px; border-radius: 14px; background: var(--fg); color: var(--bg); box-shadow: var(--shadow); max-width: calc(100vw - 32px); flex-wrap: wrap; }
.selbar .info { font-size: 13px; margin-right: 10px; white-space: nowrap; }
.selbar .info b { font-family: var(--font-mono); }
.selbar button { display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px; border-radius: 9px; font-size: 13px; white-space: nowrap; }
.selbar button:hover { background: rgba(127,127,127,.18); }
.selbar .primary { background: var(--accent); color: var(--accent-ink); }
.selbar .primary:hover { background: var(--accent); filter: brightness(1.08); }

/* ---------- albums ---------- */
#view-albums { padding-block: 24px 80px; padding-left: 28px; padding-right: max(28px, env(safe-area-inset-right, 0px)); }
.sec-head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin: 0 0 14px; }
.sec-head h2 { margin: 0; font-family: var(--font-cjk-display); font-size: 22px; font-weight: 700; }
.sec-head p { margin: 0; color: var(--muted); font-size: 12.5px; }
.album-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 22px; margin-bottom: 40px; }
.album { text-align: left; display: grid; gap: 10px; }
.album .cover { aspect-ratio: 4/3; max-width: 100%; display: grid; grid-template-columns: 2fr 1fr; grid-template-rows: 1fr 1fr; gap: 3px; border-radius: var(--r); overflow: hidden; background: var(--raise); }
.album .cover img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .3s; }
.album .cover img:first-child { grid-row: span 2; }
.album:hover .cover img { transform: scale(1.03); }
.album .t { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.album .t b { font-size: 15px; font-weight: 500; }
.album .t span { font-family: var(--font-mono); font-size: 12px; color: var(--faint); }
.album .m { font-size: 12px; color: var(--muted); margin-top: -6px; }
.smart-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
.smart { display: flex; gap: 12px; align-items: center; padding: 12px; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); text-align: left; }
.smart:hover { border-color: var(--accent); }
.smart img { width: 56px; height: 56px; border-radius: 6px; object-fit: cover; flex: none; }
.smart b { display: block; font-weight: 500; }
.smart code { font-family: var(--font-mono); font-size: 11.5px; color: var(--accent); }
.smart .n { font-size: 12px; color: var(--faint); }

/* ---------- showcase ---------- */
#view-showcase { overflow: hidden; display: flex; flex-direction: column; background: var(--sc-bg); color: var(--sc-ink); transition: background .4s; }
.sc-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; padding-block: 14px; padding-left: 24px; padding-right: max(24px, env(safe-area-inset-right, 0px)); position: relative; z-index: 2; }
.sc-ex { display: flex; gap: 6px; flex-wrap: wrap; }
.sc-ex button { height: 30px; padding: 0 12px; border-radius: 15px; font-size: 13px; color: var(--sc-sub); border: 1px solid var(--sc-line); white-space: nowrap; }
.sc-ex button[aria-pressed="true"] { background: var(--sc-ink); color: var(--sc-on); border-color: var(--sc-ink); }
.seg { display: inline-flex; padding: 3px; border-radius: 10px; border: 1px solid var(--sc-line); margin-left: auto; }
.seg button { height: 26px; padding: 0 10px; border-radius: 7px; font-size: 12.5px; color: var(--sc-sub); white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--sc-ink); color: var(--sc-on); }
.sc-play { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 14px; border-radius: 16px; background: var(--sc-ink); color: var(--sc-on); font-size: 13px; }
.sc-track { flex: 1; min-height: 0; display: flex; align-items: center; gap: var(--sc-gap); overflow-x: auto; overflow-y: hidden; padding: 10px max(40px, env(safe-area-inset-right, 0px)) 40px max(40px, env(safe-area-inset-left, 0px)); scroll-behavior: smooth; cursor: grab; scrollbar-width: none; position: relative; }
.sc-track::-webkit-scrollbar { display: none; }
.sc-track.drag { cursor: grabbing; scroll-behavior: auto; }
.sc-floor { position: absolute; left: 0; right: 0; bottom: 0; height: 22%; background: var(--sc-floor); pointer-events: none; }
.sc-nav { display: flex; align-items: center; justify-content: center; gap: 18px; padding: 0 0 18px; color: var(--sc-sub); font-family: var(--font-mono); font-size: 12px; position: relative; z-index: 2; }
.sc-nav button { width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--sc-line); display: inline-flex; align-items: center; justify-content: center; color: var(--sc-ink); }
.sc-prog { width: 160px; height: 2px; background: var(--sc-line); position: relative; }
.sc-prog i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--sc-ink); width: 0; transition: width .2s; }

.intro { flex: none; width: min(380px, 78vw); display: grid; gap: 14px; position: relative; z-index: 1; }
.intro .k { font-family: var(--font-mono); font-size: 11px; letter-spacing: .18em; text-transform: uppercase; color: var(--sc-sub); }
.intro h2 { margin: 0; font-family: var(--font-cjk-display); font-weight: 700; font-size: clamp(34px, 5vw, 52px); line-height: 1.15; text-wrap: balance; }
.intro h2 em { display: block; font-family: var(--font-display); font-style: italic; font-weight: 400; font-size: .62em; color: var(--sc-sub); margin-top: 6px; }
.intro p { margin: 0; font-family: var(--font-cjk-display); font-size: 14.5px; line-height: 1.9; color: var(--sc-sub); max-width: 32em; }
.intro .meta { font-family: var(--font-mono); font-size: 12px; color: var(--sc-sub); border-top: 1px solid var(--sc-line); padding-top: 12px; }
.outro { flex: none; width: 260px; display: grid; gap: 12px; justify-items: start; color: var(--sc-sub); position: relative; z-index: 1; font-family: var(--font-cjk-display); }
.outro b { font-size: 20px; color: var(--sc-ink); }

.piece { --ph: min(40vh, 420px); flex: none; margin: 0; position: relative; display: flex; flex-direction: column; align-items: center; gap: 22px; z-index: 1; cursor: zoom-in; }
.piece .spot { position: absolute; left: 50%; top: -38%; width: calc(var(--ph) * var(--ar) + 260px); height: calc(var(--ph) * 1.5); transform: translateX(-50%); background: radial-gradient(ellipse at 50% 30%, var(--sc-spot), transparent 62%); pointer-events: none; }
.piece .frame { position: relative; background: var(--sc-frame); padding: var(--sc-fpad); box-shadow: var(--sc-fshadow); transition: transform .3s; }
.piece:hover .frame { transform: translateY(-3px); }
.piece .mat { background: var(--sc-mat); padding: calc(var(--ph) * var(--sc-matr)); }
.piece img { display: block; height: var(--ph); width: calc(var(--ph) * var(--ar)); max-width: none; object-fit: cover; }
.plaque { align-self: center; display: grid; gap: 2px; padding: 10px 14px; min-width: 180px; background: var(--sc-plaque); color: var(--sc-pink); font-size: 12px; box-shadow: var(--sc-pshadow); }
.plaque b { font-family: var(--font-cjk-display); font-size: 14px; font-weight: 700; color: var(--sc-ink); }
.plaque .mono { font-size: 10.5px; opacity: .8; }
.piece .edge { display: none; }

/* style: gallery wall */
.sc[data-style="wall"] {
  --sc-bg: linear-gradient(180deg, #e7e6e2 0%, #dedcd7 78%, #cfcac1 78%, #c4beb3 100%);
  --sc-ink: #1d1c1a; --sc-on: #f4f3ef; --sc-sub: #5d5a54; --sc-line: rgba(29,28,26,.18);
  --sc-floor: transparent; --sc-spot: rgba(255,251,240,.85); --sc-gap: 110px;
  --sc-frame: #262421; --sc-fpad: 7px; --sc-mat: #fbfaf7; --sc-matr: .07;
  --sc-fshadow: 0 26px 30px -14px rgba(40,30,15,.45), 0 2px 4px rgba(0,0,0,.2);
  --sc-plaque: #fbfaf7; --sc-pink: #5d5a54; --sc-pshadow: 0 1px 2px rgba(0,0,0,.12);
}
/* style: dark hall */
.sc[data-style="hall"] {
  --sc-bg: radial-gradient(ellipse at 50% 0%, #26252a 0%, #141417 60%, #0e0e10 100%);
  --sc-ink: #efece6; --sc-on: #141417; --sc-sub: #9a968e; --sc-line: rgba(239,236,230,.16);
  --sc-floor: linear-gradient(180deg, transparent, rgba(0,0,0,.35)); --sc-spot: rgba(255,226,180,.16); --sc-gap: 130px;
  --sc-frame: transparent; --sc-fpad: 0px; --sc-mat: transparent; --sc-matr: 0;
  --sc-fshadow: 0 40px 60px -20px rgba(0,0,0,.85);
  --sc-plaque: transparent; --sc-pink: #9a968e; --sc-pshadow: none;
}
/* style: film strip */
.sc[data-style="film"] {
  --sc-bg: #0c0c0c; --sc-ink: #f1ede4; --sc-on: #0c0c0c; --sc-sub: #8f8a80; --sc-line: rgba(241,237,228,.15);
  --sc-floor: transparent; --sc-spot: transparent; --sc-gap: 0px;
  --sc-frame: #1b1813; --sc-fpad: 34px 14px; --sc-mat: transparent; --sc-matr: 0; --sc-fshadow: none;
  --sc-plaque: transparent; --sc-pink: #8f8a80; --sc-pshadow: none;
}
.sc[data-style="film"] .intro { margin-right: 70px; }
.sc[data-style="film"] .outro { margin-left: 70px; }
.sc[data-style="film"] .piece { --ph: min(42vh, 400px); }
.sc[data-style="film"] .frame::before, .sc[data-style="film"] .frame::after {
  content: ""; position: absolute; left: 0; right: 0; height: 12px;
  background: repeating-linear-gradient(90deg, transparent 0 9px, #e9e3d6 9px 21px, transparent 21px 30px);
  -webkit-mask: linear-gradient(#000, #000); border-radius: 2px; opacity: .88;
}
.sc[data-style="film"] .frame::before { top: 10px; }
.sc[data-style="film"] .frame::after { bottom: 10px; }
.sc[data-style="film"] .piece .edge { display: block; position: absolute; left: 16px; bottom: 23px; font-family: var(--font-mono); font-size: 8.5px; line-height: 11px; letter-spacing: .1em; color: #e39a3c; white-space: nowrap; }
.sc[data-style="film"] .piece img { filter: saturate(.92) contrast(1.04); }
.sc[data-style="film"] .piece:hover .frame { transform: none; }
.sc[data-style="film"] .plaque { padding-top: 0; }
/* style: polaroid board */
.sc[data-style="polaroid"] {
  --sc-bg: radial-gradient(circle at 20% 30%, rgba(255,255,255,.06) 0 1px, transparent 2px) 0 0/9px 9px, radial-gradient(circle at 70% 60%, rgba(0,0,0,.08) 0 1px, transparent 2px) 0 0/7px 7px, #a98762;
  --sc-ink: #2a1f14; --sc-on: #f3e9da; --sc-sub: #4b3a29; --sc-line: rgba(42,31,20,.28);
  --sc-floor: transparent; --sc-spot: rgba(255,240,215,.25); --sc-gap: 64px;
  --sc-frame: #fbfaf6; --sc-fpad: 14px 14px 64px; --sc-mat: transparent; --sc-matr: 0;
  --sc-fshadow: 0 14px 22px -8px rgba(40,25,10,.55), 0 1px 2px rgba(0,0,0,.2);
  --sc-plaque: transparent; --sc-pink: #4b3a29; --sc-pshadow: none;
}
.sc[data-style="polaroid"] .piece { --ph: min(40vh, 360px); }
.sc[data-style="polaroid"] .frame { transform: rotate(var(--rot)); }
.sc[data-style="polaroid"] .piece:hover .frame { transform: rotate(0deg) translateY(-4px) scale(1.02); }
.sc[data-style="polaroid"] .frame::before { content: ""; position: absolute; top: -12px; left: 50%; width: 90px; height: 26px; transform: translateX(-50%) rotate(-3deg); background: rgba(240,232,210,.62); box-shadow: 0 1px 2px rgba(0,0,0,.1); }
.sc[data-style="polaroid"] .piece .hand { display: block; }
.sc[data-style="polaroid"] .plaque { display: none; }
.piece .hand { display: none; position: absolute; left: 0; right: 0; bottom: 14px; text-align: center; font-family: var(--font-hand); font-size: 22px; color: #2d3a6b; line-height: 1.2; }

/* ---------- viewer ---------- */
.viewer { position: fixed; inset: 0; z-index: 50; display: grid; grid-template-columns: 1fr 340px; background: #0a0a0b; color: #ecebe7; animation: fade .2s ease; }
.viewer.noinfo { grid-template-columns: 1fr 0; }
.viewer.noinfo .v-info { display: none; }
@keyframes fade { from { opacity: 0; } }
.v-stage { position: relative; min-width: 0; min-height: 0; display: grid; grid-template-rows: auto 1fr auto; padding-top: env(safe-area-inset-top, 0px); }
.v-top { display: flex; align-items: center; gap: 6px; padding-block: 10px; padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: 12px; }
.v-top .ix { font-family: var(--font-mono); font-size: 12px; color: #8d8b86; margin-left: 6px; }
.v-btn { width: 38px; height: 38px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; color: #cfcdc8; }
.v-btn:hover { background: rgba(255,255,255,.08); color: #fff; }
.v-btn.on { color: #e2a35a; }
.v-btn.on svg.fill { fill: currentColor; }
.v-img { position: relative; min-height: 0; display: flex; align-items: center; justify-content: center; padding: 6px 64px; }
.v-img img { max-width: 100%; max-height: 100%; object-fit: contain; box-shadow: 0 20px 60px rgba(0,0,0,.6); animation: pop .28s cubic-bezier(.2,.8,.2,1); user-select: none; -webkit-user-drag: none; }
@keyframes pop { from { opacity: 0; transform: scale(.97); } }
.v-nav { position: absolute; top: 50%; transform: translateY(-50%); width: 44px; height: 44px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; background: rgba(255,255,255,.06); color: #ddd; }
.v-nav:hover { background: rgba(255,255,255,.14); }
.v-nav.l { left: 12px; } .v-nav.r { right: 12px; }
.v-strip { display: flex; gap: 4px; overflow-x: auto; padding: 10px 16px calc(12px + env(safe-area-inset-bottom, 0px)); scrollbar-width: none; justify-content: safe center; }
.v-strip::-webkit-scrollbar { display: none; }
.v-strip img { height: 44px; width: auto; flex: none; opacity: .4; border-radius: 2px; cursor: pointer; transition: opacity .15s; }
.v-strip img:hover { opacity: .75; }
.v-strip img.on { opacity: 1; outline: 2px solid #e2a35a; outline-offset: 1px; }
.v-info { background: #131315; border-left: 1px solid #222226; overflow-y: auto; padding: calc(18px + env(safe-area-inset-top, 0px)) max(20px, env(safe-area-inset-right, 0px)) 30px 20px; display: grid; gap: 20px; align-content: start; }
.v-info h2 { margin: 0; font-family: var(--font-cjk-display); font-size: 22px; font-weight: 700; }
.v-info .when { color: #a3a19b; font-size: 13px; margin-top: 4px; }
.v-sec { display: grid; gap: 8px; }
.v-sec > h5 { margin: 0; font-size: 10.5px; font-weight: 500; letter-spacing: .14em; color: #6f6d68; text-transform: uppercase; }
.exif-card { border: 1px solid #2a2a2e; border-radius: 10px; overflow: hidden; }
.exif-card .cam { padding: 10px 12px; display: grid; gap: 1px; background: #19191c; }
.exif-card .cam b { font-weight: 500; }
.exif-card .cam span { font-size: 12px; color: #9a9893; }
.exif-cells { display: grid; grid-template-columns: repeat(4, 1fr); border-top: 1px solid #2a2a2e; }
.exif-cells div { padding: 8px 4px; text-align: center; display: grid; gap: 1px; }
.exif-cells div + div { border-left: 1px solid #2a2a2e; }
.exif-cells b { font-family: var(--font-mono); font-size: 13.5px; font-weight: 500; }
.exif-cells span { font-size: 10.5px; color: #77756f; }
.hist { width: 100%; height: 74px; display: block; border-radius: 6px; background: #19191c; }
.swatches { display: flex; gap: 6px; }
.swatches div { flex: 1; display: grid; gap: 4px; }
.swatches i { height: 30px; border-radius: 5px; display: block; }
.swatches span { font-family: var(--font-mono); font-size: 9.5px; color: #85837d; text-align: center; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; font-size: 12.5px; }
.kv dt { color: #77756f; }
.kv dd { margin: 0; text-align: right; font-family: var(--font-mono); font-size: 12px; overflow-wrap: anywhere; }
.stars { display: flex; gap: 2px; }
.stars button { color: #4a4945; }
.stars button svg { width: 20px; height: 20px; }
.stars button.on { color: #e2a35a; }
.stars button.on svg { fill: currentColor; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tags span { font-size: 12px; padding: 3px 9px; border-radius: 12px; background: #202024; color: #bdbbb5; }
.info-toggle-m { display: none; }

/* ---------- modal ---------- */
.modal-wrap { position: fixed; inset: 0; z-index: 60; background: rgba(5,5,6,.55); backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center; padding: 16px; animation: fade .15s; }
.modal { width: min(560px, 100%); max-height: calc(100% - 20px); overflow-y: auto; background: var(--surface); color: var(--fg); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); padding: 24px; display: grid; gap: 18px; }
.modal h3 { margin: 0; font-family: var(--font-cjk-display); font-size: 20px; }
.modal .lead { margin: -10px 0 0; color: var(--muted); font-size: 13px; }
.opt { display: grid; gap: 8px; }
.opt > label, .opt > .lbl { font-size: 12px; color: var(--faint); letter-spacing: .04em; }
.segm { display: flex; flex-wrap: wrap; gap: 6px; }
.segm button { flex: 1; min-width: 110px; padding: 9px 10px; border: 1px solid var(--line); border-radius: 9px; text-align: left; display: grid; gap: 1px; }
.segm button b { font-weight: 500; font-size: 13px; }
.segm button span { font-size: 11.5px; color: var(--faint); font-family: var(--font-mono); }
.segm button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.sw-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); }
.sw-row div b { display: block; font-weight: 500; font-size: 13.5px; }
.sw-row div span { font-size: 12px; color: var(--faint); }
.switch { width: 40px; height: 24px; border-radius: 12px; background: var(--raise); border: 1px solid var(--line); position: relative; flex: none; transition: background .15s; }
.switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 18px; height: 18px; border-radius: 50%; background: var(--muted); transition: all .15s; }
.switch[aria-checked="true"] { background: var(--accent); border-color: var(--accent); }
.switch[aria-checked="true"]::after { left: 18px; background: var(--accent-ink); }
.txt { box-sizing: border-box; height: 36px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); padding: 0 10px; font-family: var(--font-mono); font-size: 13px; width: 100%; outline: none; }
.txt:focus { border-color: var(--accent); }
.preview-names { font-family: var(--font-mono); font-size: 11.5px; color: var(--muted); display: grid; gap: 2px; overflow-wrap: anywhere; }
.m-foot { display: flex; align-items: center; gap: 10px; justify-content: flex-end; flex-wrap: wrap; border-top: 1px solid var(--line); padding-top: 16px; }
.m-foot .est { margin-right: auto; font-size: 12.5px; color: var(--muted); }
.m-foot .est b { font-family: var(--font-mono); color: var(--fg); }
.btn { height: 38px; padding: 0 16px; border-radius: 10px; border: 1px solid var(--line); font-size: 13.5px; display: inline-flex; align-items: center; gap: 6px; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.prog { height: 6px; border-radius: 3px; background: var(--raise); overflow: hidden; }
.prog i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .12s linear; }
.prog-file { font-family: var(--font-mono); font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.done { display: grid; gap: 6px; padding: 14px; border-radius: 10px; background: var(--accent-soft); }
.done b { font-family: var(--font-mono); font-weight: 500; overflow-wrap: anywhere; }
.done span { font-size: 12.5px; color: var(--muted); }

.lan { display: grid; grid-template-columns: 150px 1fr; gap: 20px; align-items: center; }
.lan canvas { width: 150px; height: 150px; border-radius: 10px; background: #fff; padding: 10px; box-sizing: border-box; }
.lan .url { font-family: var(--font-mono); font-size: 17px; color: var(--accent); overflow-wrap: anywhere; }
.lan p { margin: 6px 0 0; font-size: 12.5px; color: var(--muted); }
.note { font-size: 11.5px; color: var(--faint); }
.device { display: flex; align-items: center; gap: 10px; padding: 8px 0; font-size: 13px; }
.device span { margin-left: auto; font-size: 12px; color: var(--faint); }

/* ---------- slideshow ---------- */
.ss { position: fixed; inset: 0; z-index: 70; background: #000; overflow: hidden; color: #fff; animation: fade .4s; }
.ss-slide { position: absolute; inset: 0; opacity: 0; transition: opacity 1.4s ease; }
.ss-slide.on { opacity: 1; }
.ss-slide img { width: 100%; height: 100%; object-fit: contain; max-width: none; }
.ss-slide.on img { animation: kb 7s ease-out forwards; }
@keyframes kb { from { transform: scale(1.02) translate(0,0); } to { transform: scale(var(--ks)) translate(var(--kx), var(--ky)); } }
.ss-cap { position: absolute; left: max(32px, env(safe-area-inset-left, 0px)); bottom: calc(40px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 4px; text-shadow: 0 1px 12px rgba(0,0,0,.7); }
.ss-cap b { font-family: var(--font-cjk-display); font-size: 26px; }
.ss-cap span { font-family: var(--font-mono); font-size: 12px; opacity: .8; }
.ss-ctl { position: absolute; right: max(24px, env(safe-area-inset-right, 0px)); bottom: calc(36px + env(safe-area-inset-bottom, 0px)); display: flex; gap: 6px; }
.ss-ctl button { width: 40px; height: 40px; border-radius: 50%; background: rgba(255,255,255,.1); display: inline-flex; align-items: center; justify-content: center; color: #fff; }
.ss-bar { position: absolute; left: 0; right: 0; top: 0; height: 2px; background: rgba(255,255,255,.12); }
.ss-bar i { display: block; height: 100%; background: #e2a35a; width: 0; }

.toast { position: fixed; left: 50%; bottom: calc(90px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%) translateY(10px); z-index: 90; background: var(--fg); color: var(--bg); padding: 9px 16px; border-radius: 10px; font-size: 13px; opacity: 0; pointer-events: none; transition: all .2s; max-width: calc(100vw - 32px); }
.toast.show { opacity: 1; transform: translateX(-50%); }
.backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 39; }

.tabbar { display: none; }

/* ---------- home ---------- */
#view-home { padding-bottom: 60px; }
.hero { position: relative; height: clamp(440px, 68vh, 760px); overflow: hidden; background: #0b0b0c; color: #fff; isolation: isolate; }
.hero-slide { position: absolute; inset: 0; opacity: 0; transition: opacity 1.6s ease; cursor: zoom-in; }
.hero-slide.on { opacity: 1; }
.hero-slide img { width: 100%; height: 100%; object-fit: cover; max-width: none; display: block; transform-origin: var(--ox, 50%) var(--oy, 50%); }
.hero-slide.on img { animation: heroKb 14s ease-out forwards; }
@keyframes heroKb { from { transform: scale(1); } to { transform: scale(1.09); } }
.hero-shade { position: absolute; inset: 0; z-index: 1; pointer-events: none; background: linear-gradient(90deg, rgba(0,0,0,.55) 0%, rgba(0,0,0,.18) 50%, transparent 78%), linear-gradient(0deg, rgba(0,0,0,.62) 0%, transparent 48%), linear-gradient(180deg, rgba(0,0,0,.35) 0%, transparent 18%); }
.hero-top { position: absolute; top: 22px; left: max(40px, env(safe-area-inset-left, 0px)); right: max(40px, env(safe-area-inset-right, 0px)); z-index: 2; display: flex; justify-content: space-between; gap: 12px; font-size: 13px; color: rgba(255,255,255,.82); pointer-events: none; }
.hero-top .mono { font-size: 12px; }
.hero-copy { position: absolute; left: max(40px, env(safe-area-inset-left, 0px)); right: max(40px, env(safe-area-inset-right, 0px)); bottom: 52px; z-index: 2; display: grid; gap: 12px; max-width: 680px; pointer-events: none; }
.hero-copy > * { animation: rise .8s cubic-bezier(.2,.8,.2,1) both; pointer-events: auto; }
.hero-copy > :nth-child(2) { animation-delay: .08s; } .hero-copy > :nth-child(3) { animation-delay: .16s; } .hero-copy > :nth-child(4) { animation-delay: .22s; } .hero-copy > :nth-child(5) { animation-delay: .3s; }
@keyframes rise { from { opacity: 0; transform: translateY(10px); } }
.hero .eyebrow { display: flex; align-items: center; gap: 12px; font-family: var(--font-mono); font-size: 11.5px; letter-spacing: .16em; text-transform: uppercase; color: rgba(255,255,255,.78); }
.hero .eyebrow::before { content: ""; width: 30px; height: 1px; background: #e2a35a; }
.hero h1 { margin: 0; font-family: var(--font-cjk-display); font-weight: 700; font-size: clamp(46px, 7.4vw, 104px); line-height: 1.04; letter-spacing: .03em; text-shadow: 0 2px 30px rgba(0,0,0,.3); text-wrap: balance; }
.hero .hsub { margin: 0; font-size: 15px; color: rgba(255,255,255,.88); }
.hero .hexif { margin: -6px 0 0; font-family: var(--font-mono); font-size: 12px; color: rgba(255,255,255,.62); }
.hero-cta { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 8px; }
.hbtn { height: 42px; padding: 0 18px; border-radius: 21px; display: inline-flex; align-items: center; gap: 8px; font-size: 14px; color: #fff; background: rgba(255,255,255,.13); border: 1px solid rgba(255,255,255,.24); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); white-space: nowrap; }
.hbtn:hover { background: rgba(255,255,255,.22); }
.hbtn.primary { background: #fff; color: #141414; border-color: #fff; }
.hbtn.primary:hover { background: #f1efe9; }
.hero-dots { position: absolute; right: max(40px, env(safe-area-inset-right, 0px)); bottom: 56px; z-index: 2; display: flex; gap: 6px; }
.hero-dots button { width: 30px; height: 20px; background: linear-gradient(rgba(255,255,255,.32), rgba(255,255,255,.32)) center / 100% 3px no-repeat; }
.hero-dots button.on { background-image: linear-gradient(#fff, #fff); }
.home-body { padding-block: 30px 0; padding-left: 28px; padding-right: max(28px, env(safe-area-inset-right, 0px)); display: grid; gap: 40px; }
.home-row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 2.1fr); gap: 28px; align-items: start; }
.memory { display: grid; min-width: 0; }
.mem-strip { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 6px; scrollbar-width: thin; }
.mem-strip img { height: 164px; width: auto; max-width: none; border-radius: 6px; flex: none; cursor: zoom-in; transition: opacity .15s; }
.mem-strip img:hover { opacity: .85; }
.link { margin-left: auto; display: inline-flex; align-items: center; gap: 4px; font-size: 13px; color: var(--muted); }
.link:hover { color: var(--accent); }
.link svg { width: 14px; height: 14px; }
.stats-line { display: flex; flex-wrap: wrap; gap: 10px 36px; color: var(--muted); font-size: 13px; border-top: 1px solid var(--line); padding-top: 22px; }
.stats-line b { font-family: var(--font-display); font-size: 34px; font-weight: 400; color: var(--fg); margin-right: 6px; font-variant-numeric: tabular-nums; }
.qt-card { border: 1px solid var(--line); background: var(--surface); border-radius: 14px; padding: 18px; display: grid; gap: 14px; }
.qt-card-h { display: flex; align-items: center; gap: 12px; }
.qt-card-h b, .dev b { display: block; font-weight: 500; }
.qt-card-h span, .dev span { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.dev-ic { width: 40px; height: 40px; border-radius: 10px; background: var(--accent-soft); color: var(--accent); display: flex; align-items: center; justify-content: center; flex: none; }
.qt-thumbs { display: flex; gap: 6px; }
.qt-thumbs .th { width: 54px; height: 54px; }
.qt-note { margin: 0; font-size: 12.5px; color: var(--muted); }
.qt-card .btn { justify-self: start; }
.th { width: 44px; height: 44px; border-radius: 6px; object-fit: cover; background: var(--raise); display: flex; align-items: center; justify-content: center; color: var(--faint); flex: none; }

/* ---------- quick transfer ---------- */
#view-transfer { padding-block: 24px 80px; padding-left: 28px; padding-right: max(28px, env(safe-area-inset-right, 0px)); }
.qt { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 36px; align-items: start; }
.qt-main { display: grid; gap: 22px; min-width: 0; }
.dev { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; padding: 14px 16px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
.dev .speed { margin-left: auto; font-family: var(--font-mono); font-size: 12px; color: var(--muted); text-align: right; }
.drop { border: 1.5px dashed var(--line); border-radius: 14px; padding: 34px 20px; display: grid; justify-items: center; gap: 8px; text-align: center; color: var(--muted); transition: background .15s, border-color .15s; }
.drop > svg { width: 26px; height: 26px; color: var(--accent); }
.drop.over { border-color: var(--accent); background: var(--accent-soft); }
.drop .big { font-size: 16px; font-weight: 500; color: var(--fg); }
.drop .row { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 8px; }
.drop label.btn { cursor: pointer; }
.q-list h4, .qt-set h4 { margin: 0 0 4px; font-size: 11px; font-weight: 500; letter-spacing: .12em; color: var(--faint); text-transform: uppercase; }
.q-item { display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); }
.nm { font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: 6px; }
.nm .dir svg { width: 14px; height: 14px; color: var(--accent); }
.st { font-size: 12px; color: var(--faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: 4px; }
.st svg { width: 12px; height: 12px; color: #5bbf7a; stroke-width: 2.4; }
.bar { height: 3px; border-radius: 2px; background: var(--raise); margin-top: 6px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); transition: width .25s linear; }
.q-item .sz { font-family: var(--font-mono); font-size: 12px; color: var(--muted); }
.qt-side { position: sticky; top: 0; display: grid; gap: 12px; justify-items: center; }
.phone-frame { width: 300px; height: 630px; max-width: 100%; border-radius: 46px; padding: 11px; background: #0c0c0e; box-shadow: 0 0 0 1px #2d2d32, 0 30px 60px -20px rgba(0,0,0,.5); box-sizing: border-box; }
.phone-screen { height: 100%; border-radius: 36px; overflow: hidden; background: var(--bg); color: var(--fg); display: flex; flex-direction: column; }
.mq-status { display: flex; justify-content: space-between; padding: 14px 26px 2px; font-size: 11px; color: var(--muted); }
.mq { flex: 1; min-height: 0; overflow-y: auto; padding: 8px 16px 22px; display: grid; gap: 16px; align-content: start; scrollbar-width: none; }
.mq-head { display: grid; gap: 2px; }
.mq-head b { font-family: var(--font-cjk-display); font-size: 19px; }
.mq-head span { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.mq-pick { display: grid; justify-items: center; gap: 3px; padding: 22px 12px; border-radius: 18px; background: var(--accent); color: var(--accent-ink); text-align: center; cursor: pointer; }
.mq-pick svg { width: 28px; height: 28px; }
.mq-pick b { font-size: 15px; }
.mq-pick span { font-size: 11.5px; opacity: .8; }
.mq-demo { justify-self: center; font-size: 12px; color: var(--accent); margin-top: -8px; }
.mq-sec { display: grid; gap: 8px; }
.mq-sec-h { display: flex; align-items: center; justify-content: space-between; }
.mq-sec-h b { font-size: 13.5px; font-weight: 500; }
.mq-sec-h button { font-size: 12px; color: var(--accent); }
.mq-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; }
.mq-t { position: relative; aspect-ratio: 1; border-radius: 6px; overflow: hidden; background: var(--raise); }
.mq-t .th { width: 100%; height: 100%; border-radius: 0; }
.mq-p { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,.5); color: #fff; font-family: var(--font-mono); font-size: 12px; }
.mq-ok { position: absolute; right: 4px; bottom: 4px; width: 18px; height: 18px; border-radius: 50%; background: #4fae6d; display: flex; align-items: center; justify-content: center; }
.mq-ok svg { width: 11px; height: 11px; stroke: #fff; stroke-width: 3; }
.mq-row { display: grid; grid-template-columns: 36px minmax(0, 1fr); gap: 10px; align-items: center; padding: 5px 0; }
.mq-row .th { width: 36px; height: 36px; }
.mq-row .nm { font-size: 12.5px; }
.mq-row .st { font-size: 11px; }

  if (mo) mo.innerHTML = QT.items.filter(x => x.dir === 'in').slice(0, 5).map(x => `<div class="mq-row">${thumbHTML(x)}<div style="min-width:0"><div class="nm">${esc(x.name)}</div>${x.status === 'running' ? `<div class="bar"><i style="width:${x.progress * 100}%"></i></div>` : `<div class="st">${ic('check')}已送达电脑</div>`}</div></div>`).join('');
  renderHomeQt();
}
function renderHomeQt() {
  const el = $('#homeQt'); if (!el || state.view !== 'home') return;
  const got = QT.items.filter(x => x.dir === 'in' && x.status === 'done').length, wait = QT.items.filter(x => x.dir === 'out' && x.status === 'waiting').length, run = QT.items.filter(x => x.status === 'running').length;
  el.innerHTML = `<div class="qt-card-h"><span class="dev-ic">${ic('phone')}</span><div><b>iPhone 15</b><span><i class="pulse"></i>已连接 · 快传就绪</span></div></div>
    <div class="qt-thumbs">${QT.items.slice(0, 4).map(thumbHTML).join('')}</div>
    <p class="qt-note">${run ? `正在传输 ${run} 个文件` : `今天收到 ${got} 个文件`}${wait ? `，${wait} 个等待在手机上保存` : ''}</p>
    <button class="btn primary" data-view="transfer">${ic('swap')}打开快传</button>`;
}
function addFiles(files, dir) {
  const fs = [...files]; if (!fs.length) return;
  fs.forEach(f => qtAdd({ dir, name: f.name, size: Math.max(.01, f.size / 1048576), thumb: f.type.startsWith('image/') ? URL.createObjectURL(f) : null }));
  renderQueue(); toast(dir === 'in' ? `手机正在发送 ${fs.length} 个文件到电脑` : `正在发送 ${fs.length} 个文件到 iPhone 15`);
}
setInterval(() => {
  let any = false;
  QT.items.forEach(x => { if (x.status !== 'running') return; any = true; x.progress = Math.min(1, x.progress + QT.speed * .25 / Math.max(.3, x.size) * (.7 + Math.random() * .6)); if (x.progress >= 1) x.status = x.dir === 'in' ? 'done' : 'waiting'; });
  if (any) renderQueue();
}, 250);
document.addEventListener('change', e => {
  if (e.target.id === 'pickFile') addFiles(e.target.files, 'out');
  else if (e.target.id === 'mqFile') addFiles(e.target.files, 'in');
  else return;
  e.target.value = '';
});
document.addEventListener('dragover', e => { if (state.view !== 'transfer') return; e.preventDefault(); const d = $('#drop'); d && d.classList.toggle('over', !!e.target.closest('#drop')); });
document.addEventListener('dragleave', e => { if (!e.relatedTarget) { const d = $('#drop'); d && d.classList.remove('over'); } });
document.addEventListener('drop', e => { if (state.view !== 'transfer') return; e.preventDefault(); const d = $('#drop'); d && d.classList.remove('over'); if (e.target.closest('#drop')) addFiles(e.dataTransfer.files, 'out'); });

/* ===================== views + chrome ===================== */
const VIEWS = [['home', '首页', 'home'], ['library', '图库', 'grid'], ['albums', '相册', 'album'], ['showcase', '陈列柜', 'frame'], ['transfer', '快传', 'swap']];
function setView(v) {
  state.view = v;
  VIEWS.forEach(([k]) => $('#view-' + k).hidden = k !== v);
  $('#tabs').innerHTML = VIEWS.map(([k, l, i]) => `<button class="tab" data-view="${k}" aria-current="${k === v}">${ic(i)}${l}</button>`).join('');
  $('#tabbar').innerHTML = VIEWS.map(([k, l, i]) => `<button data-view="${k}" aria-current="${k === v}">${ic(i)}${l}</button>`).join('');
  if (v !== 'home') clearInterval(heroT);
  renderSide();
  ({ home: renderHome, library: renderLibrary, albums: renderAlbums, showcase: renderShowcase, transfer: renderTransfer })[v]();
  $('#view-' + v).scrollTop = 0;
  if (v !== 'library' && state.selecting) setSelecting(false);
}
function closeDrawer() { $('#sidebar').classList.remove('open'); $('#backdrop').hidden = true; }
function setScope(s) { state.scope = s; state.sel.clear(); closeDrawer(); if (state.view !== 'library') setView('library'); else renderLibrary(); $('#view-library').scrollTop = 0; }

document.addEventListener('click', e => {
  const t = e.target;
  const v = t.closest('[data-view]'); if (v) return setView(v.dataset.view);
  const sc = t.closest('[data-scope]'); if (sc) return setScope({ type: sc.dataset.scope, key: sc.dataset.key });
  const al = t.closest('[data-album]'); if (al) return setScope({ type: 'album', key: al.dataset.album });
  const sm = t.closest('[data-smart]'); if (sm) return setScope({ type: 'smart', key: sm.dataset.smart });
  if (t.closest('#newSmart')) return toast('原型演示：这里会打开规则编辑器');
  if (t.closest('#clearScope')) return setScope({ type: 'all' });
  const tile = t.closest('.tile');
  if (tile) { const id = +tile.dataset.id; return state.selecting ? toggleSel(id, e.shiftKey) : openViewer(id); }
  const gs = t.closest('.g-sel');
  if (gs) { const g = groupsEl._groups[+gs.dataset.g]; if (!state.selecting) { state.selecting = true; renderLibrary(); } const all = g.items.every(p => state.sel.has(p.id)); g.items.forEach(p => all ? state.sel.delete(p.id) : state.sel.add(p.id)); groupsEl.querySelectorAll('.tile').forEach(x => x.classList.toggle('sel', state.sel.has(+x.dataset.id))); return updateSelbar(); }
  const mo = t.closest('#scrubber [data-gk]');
  if (mo) { const s = groupsEl.querySelector(`.group[data-gk="${mo.dataset.gk}"]`); if (s) $('#view-library').scrollTo({ top: s.offsetTop - 70, behavior: 'smooth' }); return; }
  const fp = t.closest('#filters .pill');
  if (fp) { const f = state.f, d = fp.dataset;
    if (d.cam) f.cams.has(d.cam) ? f.cams.delete(d.cam) : f.cams.add(d.cam);
    if (d.rate) f.minRating = +d.rate; if (d.focal) f.focal = f.focal === d.focal ? null : d.focal; if (d.orient) f.orient = f.orient === d.orient ? null : d.orient;
    renderFilters(); return renderLibrary(); }
  if (t.closest('#filterBtn')) { state.showFilters = !state.showFilters; renderFilters(); return renderLibrary(); }
  if (t.closest('#selBtn')) return setSelecting(!state.selecting);
  if (t.closest('#sbX')) return setSelecting(false);
  if (t.closest('#sbAll')) { state.list.forEach(p => state.sel.add(p.id)); groupsEl.querySelectorAll('.tile').forEach(x => x.classList.add('sel')); return updateSelbar(); }
  if (t.closest('#sbPack')) return state.sel.size && packModal();
  if (t.closest('#sbShow')) { if (!state.sel.size) return; const ids = [...state.sel].sort((a, b) => byId(a).ts - byId(b).ts); EXHIBITS.push({ key: 'new' + EXHIBITS.length, title: '新展览', en: 'Untitled', ids, words: `从图库挑选的 ${ids.length} 张照片。点击标题旁的编辑按钮可以写前言、调整顺序（原型暂未实现）。` }); state.ex = EXHIBITS.length - 1; setSelecting(false); setView('showcase'); return toast('已用所选照片创建展览'); }
  const ex = t.closest('[data-ex]'); if (ex) { state.ex = +ex.dataset.ex; return renderShowcase(); }
  const st = t.closest('[data-st]'); if (st) { state.scStyle = st.dataset.st; return renderShowcase(); }
  if (t.closest('#scPlay')) return startExShow();
  if (t.closest('#scPrev')) return scGo(-1);
  if (t.closest('#scNext')) return scGo(1);
  if (t.closest('#phoneBtn') || t.closest('#pairBtn')) return phoneModal();
  const hd = t.closest('[data-hero]'); if (hd) { heroShow(+hd.dataset.hero); return heroTimer(); }
  if (t.closest('#heroPlay')) return slideshow(heroF.map(p => p.id), heroI, '今日精选');
  if (t.closest('#heroInfo') || t.closest('.hero-slide')) return openViewer(heroF[heroI].id, heroF);
  const mm = t.closest('[data-mem]'); if (mm) return openViewer(+mm.dataset.mem, state.memItems);
  if (t.closest('#pickLib')) { setView('library'); setSelecting(true); return toast('挑好照片后，点底部的「发到手机」'); }
  if (t.closest('#mqDemo')) { const ph = PHOTOS.filter(p => p.cam === 'IP'); for (let k = 0; k < 3; k++) { const p = ph[(QT.seq + k) % ph.length]; qtAdd({ dir: 'in', name: `IMG_${7000 + QT.seq * 7 + k}.HEIC`, size: +(p.mb * (1 + Math.random())).toFixed(1), thumb: p.thumb }); } renderQueue(); return toast('手机正在发送 3 张照片到电脑'); }
  if (t.closest('#mqSave')) { const w = QT.items.filter(x => x.dir === 'out' && x.status === 'waiting'); w.forEach(x => x.status = 'saved'); renderQueue(); return toast(w.length ? `iPhone 上会弹出分享面板，点「存储 ${w.length} 张图像」即可` : '没有等待保存的照片'); }
  const qo = t.closest('[data-qopt]'); if (qo) { QT.opts[qo.dataset.qopt] = !QT.opts[qo.dataset.qopt]; qo.setAttribute('aria-checked', QT.opts[qo.dataset.qopt]); return renderQueue(); }
  if (t.closest('#chDir')) return toast('原型演示：这里会打开文件夹选择窗口');
  if (t.closest('#sbSend')) { if (!state.sel.size) return; const ps = [...state.sel].map(byId), raw = ps.filter(p => !['HEIC'].includes(p.file.split('.').pop())).length; ps.forEach(p => qtAdd({ dir: 'out', name: p.cam === 'IP' ? p.file : p.file.replace(/\.\w+$/, '.jpg'), size: p.cam === 'IP' ? p.mb : +(p.mp * .3).toFixed(1), thumb: p.thumb })); setSelecting(false); setView('transfer'); return toast(`正在发送 ${ps.length} 张到 iPhone 15${raw ? `，其中 ${raw} 张 RAW 已转为 JPG 方便手机保存` : ''}`); }
  if (t.closest('#themeBtn')) { const root = document.documentElement, dark = getComputedStyle(root).colorScheme.includes('dark'); root.dataset.theme = dark ? 'light' : 'dark'; try { localStorage.setItem('dv-theme', root.dataset.theme); } catch (_) {} return paintTheme(); }
  if (t.closest('#menuBtn')) { $('#sidebar').classList.add('open'); $('#backdrop').hidden = false; return; }
  if (t.closest('#backdrop')) return closeDrawer();
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.classList?.contains('tile')) e.target.click();
  if (state.view === 'showcase' && viewer.hidden && modal.hidden && $('#ss').hidden) { if (e.key === 'ArrowRight') scGo(1); if (e.key === 'ArrowLeft') scGo(-1); }
});
$('#sortSel').addEventListener('change', e => { state.sort = e.target.value; state.dir = ['hue', 'camera', 'aperture'].includes(state.sort) ? 1 : -1; if (['hue', 'random', 'size', 'iso', 'aperture', 'focal'].includes(state.sort) && (state.group === 'month' || state.group === 'year')) { state.group = 'none'; $('#groupSel').value = 'none'; toast(state.sort === 'hue' ? '按色调排列时取消分组，照片会排成一道色带' : '已取消按时间分组'); } renderLibrary(); });
$('#groupSel').addEventListener('change', e => { state.group = e.target.value; renderLibrary(); });
$('#dirBtn').addEventListener('click', () => { state.dir *= -1; renderLibrary(); });
$('#density').addEventListener('input', e => { state.rowH = +e.target.value; renderLibrary(); });
let qT; $('#q').addEventListener('input', e => { clearTimeout(qT); qT = setTimeout(() => { state.q = e.target.value; if (state.view !== 'library') setView('library'); else renderLibrary(); }, 140); });
$('#view-library').addEventListener('scroll', () => requestAnimationFrame(syncScrubber));
let rzW = 0; new ResizeObserver(() => { const w = groupsEl.clientWidth; if (w && w !== rzW) { rzW = w; if (state.view === 'library') renderLibrary(); } }).observe(groupsEl);

function paintTheme() { const dark = getComputedStyle(document.documentElement).colorScheme.includes('dark'); $('#themeBtn').innerHTML = ic(dark ? 'sun' : 'moon'); }
try { const t = localStorage.getItem('dv-theme'); if (t) document.documentElement.dataset.theme = t; } catch (_) {}
$('#menuBtn').innerHTML = ic('menu');
$('#phoneBtn').innerHTML = ic('phone') + '<span class="lbl">手机访问</span>';
$('.search').insertAdjacentHTML('afterbegin', ic('search'));
paintTheme(); setView('home');
</script>
